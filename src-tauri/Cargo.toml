[workspace]
members = [".", "helper"]

[package]
name = "partagpu"
version = "1.7.0"
description = "Partage de ressources de calcul sur réseau local"
authors = ["César Lizurey"]
homepage = "https://cesar.lizurey.fr"
repository = "https://github.com/cesar-lizurey/partagpu"
license = "MIT"
edition = "2021"

[lib]
name = "partagpu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
mdns-sd = "0.11"
sysinfo = "0.35"
local-ip-address = "0.6"
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
totp-rs = { version = "5", features = ["gen_secret"] }
base32 = "0.5"
data-encoding = "2"
hmac = "0.12"
sha1 = "0.10"
log = "0.4"
env_logger = "0.11"
# HTTP client used to dispatch tasks to remote peers (no TLS needed on LAN).
ureq = { version = "2", default-features = false, features = ["json"] }
# Peer-to-peer encryption (AES-256-GCM keyed by HKDF-SHA256(room secret + ECDH)).
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
# Forward secrecy : ephemeral X25519 keys derived via Diffie-Hellman per request.
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Gzip for workspace compression on the dispatcher → peer hop.
flate2 = "1"
