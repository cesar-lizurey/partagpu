<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1d27"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <filter id="ash">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <marker id="aarr" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#6366f1"/>
    </marker>
    <marker id="garr" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#22c55e"/>
    </marker>
    <marker id="rarr" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="760" height="360" rx="16" fill="url(#abg)"/>
  <text x="380" y="28" text-anchor="middle" fill="#e4e6eb" font-size="15" font-weight="600">Vérification d'auth des pairs (HMAC + AES-256-GCM)</text>

  <!-- Shared key block -->
  <rect x="240" y="48" width="280" height="46" rx="8" fill="#222632" stroke="#6366f1" stroke-width="1.5"/>
  <text x="380" y="68" text-anchor="middle" fill="#6366f1" font-size="12" font-weight="600">Passphrase 4 mots → HKDF-SHA256</text>
  <text x="380" y="84" text-anchor="middle" fill="#8b8fa3" font-size="10">auth_key (32 o, RAM seulement) — partagée par toute la salle</text>

  <line x1="320" y1="94" x2="170" y2="130" stroke="#6366f1" stroke-width="1.5" marker-end="url(#aarr)"/>
  <line x1="440" y1="94" x2="590" y2="130" stroke="#6366f1" stroke-width="1.5" marker-end="url(#aarr)"/>

  <!-- Machine A (client) -->
  <rect x="40" y="130" width="260" height="100" rx="8" fill="#222632" stroke="#22c55e" stroke-width="1.5" filter="url(#ash)"/>
  <text x="170" y="152" text-anchor="middle" fill="#e4e6eb" font-size="12" font-weight="600">PC-César (client)</text>
  <text x="170" y="172" text-anchor="middle" fill="#22c55e" font-size="10">ts = now()</text>
  <text x="170" y="188" text-anchor="middle" fill="#22c55e" font-size="10" font-family="ui-monospace, monospace">HMAC = HMAC-SHA256(auth_key,</text>
  <text x="170" y="202" text-anchor="middle" fill="#22c55e" font-size="10" font-family="ui-monospace, monospace">  ts ‖ method ‖ path ‖ sha256(body))</text>
  <text x="170" y="220" text-anchor="middle" fill="#8b8fa3" font-size="9">header X-PartaGPU-AUTH: &lt;ts&gt;:&lt;HMAC&gt;</text>

  <!-- Machine B (server) -->
  <rect x="460" y="130" width="260" height="100" rx="8" fill="#222632" stroke="#22c55e" stroke-width="1.5" filter="url(#ash)"/>
  <text x="590" y="152" text-anchor="middle" fill="#e4e6eb" font-size="12" font-weight="600">PC-Corinne (serveur)</text>
  <text x="590" y="172" text-anchor="middle" fill="#22c55e" font-size="10">vérifie |now − ts| ≤ 30 s</text>
  <text x="590" y="188" text-anchor="middle" fill="#22c55e" font-size="10">recalcule HMAC, compare en temps constant</text>
  <text x="590" y="206" text-anchor="middle" fill="#8b8fa3" font-size="10">si OK → AES-256-GCM decrypt + dispatch</text>
  <text x="590" y="220" text-anchor="middle" fill="#8b8fa3" font-size="10">si mismatch → 401 avant déchiffrement</text>

  <!-- Request line A → B -->
  <line x1="300" y1="180" x2="460" y2="180" stroke="#22c55e" stroke-width="1.5" marker-end="url(#garr)"/>
  <text x="380" y="173" text-anchor="middle" fill="#22c55e" font-size="10">HTTP POST /peer/v1/dispatch (chiffré)</text>

  <!-- OK badges -->
  <line x1="170" y1="230" x2="170" y2="262" stroke="#8b8fa3" stroke-width="1.5" marker-end="url(#aarr)"/>
  <line x1="590" y1="230" x2="590" y2="262" stroke="#8b8fa3" stroke-width="1.5" marker-end="url(#aarr)"/>
  <rect x="100" y="262" width="140" height="28" rx="6" fill="rgba(34,197,94,0.15)"/>
  <text x="170" y="281" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">OK — vérifié</text>
  <rect x="520" y="262" width="140" height="28" rx="6" fill="rgba(34,197,94,0.15)"/>
  <text x="590" y="281" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">OK — vérifié</text>

  <!-- Attacker -->
  <rect x="290" y="262" width="180" height="60" rx="8" fill="#222632" stroke="#ef4444" stroke-width="1.5" filter="url(#ash)"/>
  <text x="380" y="282" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="600">Attaquant</text>
  <text x="380" y="298" text-anchor="middle" fill="#8b8fa3" font-size="10">ne connaît pas auth_key</text>
  <text x="380" y="312" text-anchor="middle" fill="#8b8fa3" font-size="10">→ HMAC invalide</text>

  <line x1="380" y1="322" x2="380" y2="346" stroke="#ef4444" stroke-width="1.5" marker-end="url(#rarr)"/>
  <text x="380" y="356" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">401 — rejeté avant le déchiffrement</text>
</svg>
