<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg-co-en" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1d27"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <filter id="sh-co-en">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <marker id="arr-co-en" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#8b8fa3"/>
    </marker>
    <marker id="arr-co-en-purple" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="820" height="460" rx="16" fill="url(#bg-co-en)"/>

  <!-- Machine A frame -->
  <rect x="20" y="20" width="500" height="420" rx="12" fill="none" stroke="#2a2e3a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="270" y="46" text-anchor="middle" fill="#e4e6eb" font-size="14" font-weight="600">Machine A — my station</text>

  <!-- Notebook -->
  <rect x="50" y="70" width="170" height="60" rx="8" fill="#222632" stroke="#10b981" stroke-width="1.5" filter="url(#sh-co-en)"/>
  <text x="135" y="95" text-anchor="middle" fill="#10b981" font-size="12" font-weight="600">Python notebook</text>
  <text x="135" y="113" text-anchor="middle" fill="#8b8fa3" font-size="10">partagpu.run_remote / .distribute</text>

  <!-- App Tauri box -->
  <rect x="240" y="70" width="260" height="220" rx="10" fill="#1f232d" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="370" y="92" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">PartaGPU app (Tauri)</text>

  <!-- UI -->
  <rect x="260" y="105" width="100" height="40" rx="6" fill="#2a2e3a"/>
  <text x="310" y="130" text-anchor="middle" fill="#6366f1" font-size="11" font-weight="600">React frontend</text>

  <!-- http_api -->
  <rect x="380" y="105" width="100" height="40" rx="6" fill="#2a2e3a"/>
  <text x="430" y="123" text-anchor="middle" fill="#e4e6eb" font-size="10">http_api</text>
  <text x="430" y="138" text-anchor="middle" fill="#8b8fa3" font-size="9">127.0.0.1:7654</text>

  <!-- peer_api -->
  <rect x="260" y="160" width="100" height="40" rx="6" fill="#2a2e3a"/>
  <text x="310" y="178" text-anchor="middle" fill="#e4e6eb" font-size="10">peer_api</text>
  <text x="310" y="193" text-anchor="middle" fill="#8b8fa3" font-size="9">0.0.0.0:7655</text>

  <!-- Discovery -->
  <rect x="380" y="160" width="100" height="40" rx="6" fill="#2a2e3a"/>
  <text x="430" y="178" text-anchor="middle" fill="#e4e6eb" font-size="10">discovery</text>
  <text x="430" y="193" text-anchor="middle" fill="#8b8fa3" font-size="9">mDNS</text>

  <!-- Sandbox -->
  <rect x="260" y="215" width="220" height="60" rx="6" fill="#2a2e3a"/>
  <text x="370" y="234" text-anchor="middle" fill="#e4e6eb" font-size="11" font-weight="600">sandbox (bubblewrap)</text>
  <text x="370" y="251" text-anchor="middle" fill="#8b8fa3" font-size="10">/dev/nvidia* + /workspace tmpfs</text>
  <text x="370" y="266" text-anchor="middle" fill="#8b8fa3" font-size="10">cgroup partagpu/task-&lt;uuid&gt;</text>

  <!-- Helper -->
  <rect x="50" y="320" width="450" height="50" rx="8" fill="#222632" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh-co-en)"/>
  <text x="275" y="345" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="600">partagpu-helper (root, via pkexec)</text>
  <text x="275" y="362" text-anchor="middle" fill="#8b8fa3" font-size="10">create-user · setup-cgroup · open-port · setup-venv</text>

  <!-- Internal arrows -->
  <line x1="220" y1="100" x2="260" y2="125" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-co-en)"/>
  <text x="220" y="92" fill="#10b981" font-size="9">local HTTP</text>
  <line x1="370" y1="290" x2="370" y2="320" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-co-en)"/>

  <!-- Machine B frame -->
  <rect x="540" y="20" width="260" height="420" rx="12" fill="none" stroke="#2a2e3a" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="670" y="46" text-anchor="middle" fill="#e4e6eb" font-size="14" font-weight="600">Machine B — peer</text>

  <rect x="560" y="80" width="220" height="340" rx="10" fill="#1f232d" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="670" y="102" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">PartaGPU app (Tauri)</text>

  <rect x="580" y="115" width="180" height="40" rx="6" fill="#2a2e3a"/>
  <text x="670" y="133" text-anchor="middle" fill="#e4e6eb" font-size="10">peer_api 0.0.0.0:7655</text>
  <text x="670" y="148" text-anchor="middle" fill="#8b8fa3" font-size="9">accepts encrypted tasks</text>

  <rect x="580" y="170" width="180" height="60" rx="6" fill="#2a2e3a"/>
  <text x="670" y="190" text-anchor="middle" fill="#e4e6eb" font-size="11" font-weight="600">sandbox (bubblewrap)</text>
  <text x="670" y="207" text-anchor="middle" fill="#8b8fa3" font-size="10">runs incoming tasks</text>
  <text x="670" y="222" text-anchor="middle" fill="#8b8fa3" font-size="10">with /dev/nvidia* binds</text>

  <rect x="580" y="245" width="180" height="40" rx="6" fill="#2a2e3a"/>
  <text x="670" y="270" text-anchor="middle" fill="#8b8fa3" font-size="10">partagpu UID — managed venv</text>

  <rect x="580" y="305" width="180" height="40" rx="6" fill="#222632" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="670" y="330" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="600">partagpu-helper</text>

  <!-- Inter-machine link -->
  <line x1="500" y1="180" x2="560" y2="135" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr-co-en-purple)" marker-start="url(#arr-co-en-purple)"/>
  <rect x="510" y="148" width="40" height="20" rx="10" fill="#a78bfa" fill-opacity="0.15"/>
  <text x="530" y="162" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="600">LAN</text>

  <!-- Caption -->
  <text x="410" y="436" text-anchor="middle" fill="#8b8fa3" font-size="10">peer ↔ peer: HTTP + AES-256-GCM (per-request X25519 ECDH ephemeral key, TOTP signature)</text>
</svg>
